name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sim:smoke
      - run: npm run tools:smoke
      - run: npm run ui:smoke
      - run: npm run pins:smoke
      - run: npm run share:smoke
      - run: npm run assets:smoke
      - run: npm run water:smoke
      - run: npm run flowfx:smoke
      - run: npm run build
